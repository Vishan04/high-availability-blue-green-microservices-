apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
      version: green
  template:
    metadata:
      labels:
        app: product-service
        version: green
    spec:
      containers:
        - name: product-service
          image: blue-green-product-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: green
spec:
  selector:
    app: product-service
    version: green
  ports:
    - port: 5001
      targetPort: 5001