apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: blue
  template:
    metadata:
      labels:
        app: frontend
        version: blue
    spec:
      containers:
        - name: frontend
          image: blue-green-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blue
spec:
  selector:
    app: frontend
    version: blue
  ports:
    - port: 5000
      targetPort: 5000